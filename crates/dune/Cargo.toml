[package]
name = "dune"
version = "0.0.0"
edition.workspace = true

[dependencies]
bytes_ext = { workspace = true }
clap = { workspace = true, features = ["derive"] }
cpal = { workspace = true }
num = { workspace = true }
nuked_opl3 = { workspace = true }
png = { workspace = true }
winit = { version = "0.30.12", features = ["rwh_06"] }
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
paste = "1.0.15"

[target.'cfg(target_os = "macos")'.dependencies]
# Already a winit dependency (same version); used for NSCursor::hide/unhide,
# which apply cursor visibility immediately where winit's cursor-rect path
# only takes effect on the next pointer move.
objc2-app-kit = { version = "0.2.2", features = ["NSCursor"] }
# Names the sRGB colour space for the presentation layer (see
# `set_srgb_colorspace`). Pinned to the version wgpu-hal 30 links, so the
# `CGColorSpace` we hand to the layer is the type its `CAMetalLayer` expects.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGColorSpace",
] }

[lints]
workspace = true

[dev-dependencies]
# Validates dune.wgsl offline (no GPU needed); naga is wgpu's own shader frontend.
naga = { version = "30", features = ["wgsl-in"] }
